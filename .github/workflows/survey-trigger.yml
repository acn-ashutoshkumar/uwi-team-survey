name: "Open Monthly Survey"

on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:
    inputs:
      custom_title:
        description: "Custom survey title (optional)"
        required: false
        default: ""

permissions:
  issues: write
  contents: read

jobs:
  open-survey:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up month label
        id: month
        run: |
          MONTH=$(date +"%Y-%m")
          DATE=$(date +"%B %Y")
          echo "month=$MONTH" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT

      - name: Read team members from config
        id: config
        run: |
          ASSIGNEES=$(python3 -c "
          import yaml
          with open('survey-config.yml') as f:
              cfg = yaml.safe_load(f)
          team = cfg['survey']['team']
          print(','.join(team))
          ")
          echo "assignees=$ASSIGNEES" >> $GITHUB_OUTPUT
          LABEL=$(python3 -c "
          import yaml
          with open('survey-config.yml') as f:
              cfg = yaml.safe_load(f)
          print(cfg['survey']['issue_label'])
          ")
          echo "label=$LABEL" >> $GITHUB_OUTPUT

      - name: Create one issue per team member
        uses: actions/github-script@v7
        with:
          script: |
            const month = "${{ steps.month.outputs.month }}";
            const date  = "${{ steps.month.outputs.date }}";
            const assigneesStr = "${{ steps.config.outputs.assignees }}";
            const assignees = assigneesStr.split(',').map(a => a.trim()).filter(Boolean);
            const label = "${{ steps.config.outputs.label }}";
            const customTitle = "${{ github.event.inputs.custom_title }}";

            for (const member of assignees) {
              const title = customTitle
                ? `[SURVEY] ${customTitle} - ${month}`
                : `UWI Monthly Survey - ${month} - ${member}`;

              const body = [
                `Hi @${member}, please fill in your monthly UWI survey for **${date}**.`,
                ``,
                `**How to respond:** Type your answer number (1-5) in each box. For Q6 list all tools that apply.`,
                `Close this issue when done. Survey expires in **48 hours**.`,
                ``,
                `---`,
                `## SECTION 1 - Process and Ways of Working`,
                `---`,
                ``,
                `**Q1 — Sprint and Delivery Process**`,
                `How satisfied are you with the current sprint cadence, ticket quality, and delivery processes on UWI?`,
                `1 = Very Dissatisfied · 2 = Dissatisfied · 3 = Neutral · 4 = Satisfied · 5 = Very Satisfied`,
                ``,
                `**My rating: [ ]**`,
                ``,
                `---`,
                ``,
                `**Q2 — Collaboration and Cross-Team Dependencies**`,
                `How effectively do the UWI sub-teams (Frontend, Backend, QA, Infra) collaborate and resolve cross-team blockers?`,
                `1 = Very Ineffective · 2 = Ineffective · 3 = Neutral · 4 = Effective · 5 = Very Effective`,
                ``,
                `**My rating: [ ]**`,
                ``,
                `---`,
                ``,
                `**Q3 — Technical Debt and Code Quality**`,
                `How confident are you that the current codebase and architecture allow you to deliver new features without significant rework?`,
                `1 = Not at all confident · 2 = Slightly confident · 3 = Neutral · 4 = Confident · 5 = Fully confident`,
                ``,
                `**My rating: [ ]**`,
                ``,
                `---`,
                `## SECTION 2 - Roadmap Clarity and Product Direction`,
                `---`,
                ``,
                `**Q4 — Roadmap Visibility**`,
                `How clearly do you understand the UWI product roadmap and how your current sprint work connects to it?`,
                `1 = No clarity · 2 = Limited clarity · 3 = Neutral · 4 = Clear · 5 = Full clarity`,
                ``,
                `**My rating: [ ]**`,
                ``,
                `---`,
                ``,
                `**Q5 — Requirements Quality**`,
                `How often do you start development work with clear, well-defined, and stable requirements?`,
                `1 = Almost never · 2 = Rarely · 3 = Sometimes · 4 = Often · 5 = Almost always`,
                ``,
                `**My rating: [ ]**`,
                ``,
                `---`,
                `## SECTION 3 - GenAI Adoption and Tooling`,
                `---`,
                ``,
                `**Q6 — GenAI Tool Usage** *(multi-select — list all that apply)*`,
                `Which GenAI tools are you currently using in your UWI development workflow?`,
                `- [ ] GitHub Copilot`,
                `- [ ] Claude (Anthropic)`,
                `- [ ] ChatGPT / OpenAI`,
                `- [ ] Cursor`,
                `- [ ] Other`,
                `- [ ] None`,
                ``,
                `---`,
                ``,
                `**Q7 — GenAI Impact on Productivity**`,
                `How much has GenAI tooling improved your personal productivity on UWI compared to 6 months ago?`,
                `1 = No improvement · 2 = Slight improvement · 3 = Moderate · 4 = Good improvement · 5 = Significant improvement`,
                ``,
                `**My rating: [ ]**`,
                ``,
                `---`,
                ``,
                `**Q8 — GenAI Confidence and Trust**`,
                `How confident are you in reviewing and shipping AI-generated code without introducing quality or security issues?`,
                `1 = Not confident · 2 = Slightly confident · 3 = Neutral · 4 = Confident · 5 = Very confident`,
                ``,
                `**My rating: [ ]**`,
                ``,
                `---`,
                `## SECTION 4 - Client Satisfaction and Stakeholder Alignment`,
                `---`,
                ``,
                `**Q9 — Client Feedback Loop**`,
                `How well does feedback from the NTT Docomo client reach the development team in a timely and actionable way?`,
                `1 = Rarely or Never · 2 = Occasionally · 3 = Sometimes · 4 = Often · 5 = Always with clear actions`,
                ``,
                `**My rating: [ ]**`,
                ``,
                `---`,
                `## SECTION 5 - Overall Satisfaction`,
                `---`,
                ``,
                `**Q10 — Overall Satisfaction**`,
                `Overall, how proud are you of the work being delivered on UWI, and how satisfied are you as a developer on this project?`,
                `1 = Very Dissatisfied · 2 = Dissatisfied · 3 = Neutral · 4 = Satisfied · 5 = Very Satisfied`,
                ``,
                `**My rating: [ ]**`,
                ``,
                `---`,
                `*Fill in all ratings above, then close this issue. Your response will be auto-collected.*`,
              ].join("\n");

              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                title: title,
                body:  body,
                labels: [label],
                assignees: [member],
              });

              console.log(`Created issue #${issue.data.number} for ${member}`);
            }
