name: "Open Weekly Survey"

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      custom_title:
        description: "Custom survey title (optional)"
        required: false
        default: ""

permissions:
  issues: write
  contents: read

jobs:
  open-survey:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up week label
        id: week
        run: |
          WEEK=$(date +"%Y-W%V")
          DATE=$(date +"%d %b %Y")
          echo "week=$WEEK" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT

      - name: Read team members from config
        id: config
        run: |
          ASSIGNEES=$(python3 -c "
          import yaml
          with open('survey-config.yml') as f:
              cfg = yaml.safe_load(f)
          team = cfg['survey']['team']
          print(','.join(team))
          ")
          echo "assignees=$ASSIGNEES" >> $GITHUB_OUTPUT
          LABEL=$(python3 -c "
          import yaml
          with open('survey-config.yml') as f:
              cfg = yaml.safe_load(f)
          print(cfg['survey']['issue_label'])
          ")
          echo "label=$LABEL" >> $GITHUB_OUTPUT

      - name: Create one issue per team member
        uses: actions/github-script@v7
        with:
          script: |
            const week = "${{ steps.week.outputs.week }}";
            const date = "${{ steps.week.outputs.date }}";
            const assigneesStr = "${{ steps.config.outputs.assignees }}";
            const assignees = assigneesStr.split(',').map(a => a.trim()).filter(Boolean);
            const label = "${{ steps.config.outputs.label }}";
            const customTitle = "${{ github.event.inputs.custom_title }}";

            for (const member of assignees) {
              const title = customTitle
                ? `[SURVEY] ${customTitle} - ${week}`
                : `UWI Team Pulse - ${week} - ${member}`;

              const body = [
                `### 1. Team morale`,
                `- [ ] 1 - Low`,
                `- [ ] 2 - Below average`,
                `- [ ] 3 - OK`,
                `- [ ] 4 - Good`,
                `- [ ] 5 - Great`,
                ``,
                `### 2. Workload`,
                `- [ ] 1 - Very light`,
                `- [ ] 2 - Light`,
                `- [ ] 3 - About right`,
                `- [ ] 4 - Heavy`,
                `- [ ] 5 - Overloaded`,
                ``,
                `### 3. Blockers`,
                `- [ ] Technical debt / legacy issues`,
                `- [ ] Waiting on another team`,
                `- [ ] Unclear requirements`,
                `- [ ] Infrastructure / environment issues`,
                `- [ ] No blockers`,
                ``,
                `### 4. Weekly highlight`,
                `- [ ] Completed planned tasks`,
                `- [ ] Good team collaboration`,
                `- [ ] Resolved a blocker`,
                `- [ ] Nothing significant`,
              ].join("\n");

              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: [label],
                assignees: [member],
              });

              console.log(`Created issue #${issue.data.number} for ${member}`);
            }
