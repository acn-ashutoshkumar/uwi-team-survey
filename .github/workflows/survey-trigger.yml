name: "📋 Open Weekly Survey"

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      custom_title:
        description: "Custom survey title (optional)"
        required: false
        default: ""

permissions:
  issues: write
  contents: read

jobs:
  open-survey:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up week label
        id: week
        run: |
          WEEK=$(date +"%Y-W%V")
          DATE=$(date +"%d %b %Y")
          echo "week=$WEEK" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT

      - name: Read team members from config
        id: config
        run: |
          ASSIGNEES=$(python3 -c "
          import yaml
          with open('survey-config.yml') as f:
              cfg = yaml.safe_load(f)
          team = cfg['survey']['team']
          print(','.join(team))
          ")
          echo "assignees=$ASSIGNEES" >> $GITHUB_OUTPUT
          LABEL=$(python3 -c "
          import yaml
          with open('survey-config.yml') as f:
              cfg = yaml.safe_load(f)
          print(cfg['survey']['issue_label'])
          ")
          echo "label=$LABEL" >> $GITHUB_OUTPUT

      - name: Create survey issue via GitHub API
        id: create_issue
        uses: actions/github-script@v7
        with:
          script: |
            const week = "${{ steps.week.outputs.week }}";
            const date = "${{ steps.week.outputs.date }}";
            const assigneesStr = "${{ steps.config.outputs.assignees }}";
            const assignees = assigneesStr.split(',').map(a => a.trim()).filter(Boolean);
            const label = "${{ steps.config.outputs.label }}";
            const customTitle = "${{ github.event.inputs.custom_title }}";

            const title = customTitle
              ? customTitle
              : `[SURVEY] Team Pulse — ${week} (${date})`;

            const body = `## 👋 UWI Weekly Team Pulse
**Week:** ${week} — ${date}
Please fill this out by **end of day Friday**. It takes ~2 minutes.

> ⚠️ **Instructions:** For rating questions, tick ONLY ONE checkbox. For blockers, tick all that apply.

---

### 1. Team morale
*How is team morale this week? (select ONE)*
- [ ] 1 — Low
- [ ] 2 — Below average
- [ ] 3 — OK
- [ ] 4 — Good
- [ ] 5 — Great

---

### 2. Blockers
*Are you facing any blockers? (select all that apply)*
- [ ] Technical debt / legacy issues
- [ ] Waiting on another team
- [ ] Unclear requirements
- [ ] Infrastructure / environment issues
- [ ] No blockers

---

### 3. Weekly highlight *(optional)*
**Write your answer below this line:**


---

### 4. Concern or suggestion *(optional)*
**Write your answer below this line:**


---
*Once you have filled this in, click **Close issue** at the bottom. Your response will be auto-collected.*`;

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: [label],
              assignees: assignees,
            });

            console.log(`Created issue #${issue.data.number}: ${issue.data.html_url}`);
            core.setOutput('issue_number', issue.data.number);
            core.setOutput('issue_url', issue.data.html_url);

      - name: Post full survey link as comment
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = ${{ steps.create_issue.outputs.issue_number }};
            const issueUrl = "${{ steps.create_issue.outputs.issue_url }}";
            const week = "${{ steps.week.outputs.week }}";
            const date = "${{ steps.week.outputs.date }}";
            const assigneesStr = "${{ steps.config.outputs.assignees }}";
            const mentions = assigneesStr.split(',').map(a => `@${a.trim()}`).join(' ');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `👋 ${mentions}

The **${week} (${date})** team survey is now open!

🔗 **Fill it out here:** ${issueUrl}

Please complete by **end of day Friday** and close the issue when done.`
            });
