name: "Collect Survey Response"

on:
  issues:
    types: [closed]

permissions:
  issues: read
  contents: write

jobs:
  collect-response:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'team-survey') && contains(toJson(github.event.issue.assignees.*.login), github.event.sender.login)

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse and save response
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const issue = context.payload.issue;
            const body = issue.body || '';

            // Person who closed the issue = respondent
            const respondent = context.payload.sender?.login || issue.user?.login || 'unknown';

            // Extract week from issue title
            const titleMatch = issue.title.match(/(\d{4}-W\d{2})/);
            const d = new Date();
            const startOfYear = new Date(d.getFullYear(), 0, 1);
            const weekNum = Math.ceil(((d - startOfYear) / 86400000 + startOfYear.getDay() + 1) / 7);
            const week = titleMatch ? titleMatch[1] : `${d.getFullYear()}-W${String(weekNum).padStart(2,'0')}`;

            // Parse single-select rating (first checked box only)
            function parseRating(section, body) {
              const lines = body.split('\n');
              let inSection = false;
              for (const line of lines) {
                if (line.includes('### ') && line.includes(section)) { inSection = true; continue; }
                if (inSection && (line.trim().startsWith('- [x]') || line.trim().startsWith('- [X]'))) {
                  const match = line.match(/(\d)/);
                  return match ? parseInt(match[1]) : null;
                }
                if (inSection && line.trim().startsWith('###')) break;
              }
              return null;
            }

            // Parse checkboxes (multiple)
            function parseCheckboxes(section, body) {
              const lines = body.split('\n');
              let inSection = false;
              const selected = [];
              for (const line of lines) {
                if (line.includes('### ') && line.includes(section)) { inSection = true; continue; }
                if (inSection && (line.trim().startsWith('- [x]') || line.trim().startsWith('- [X]'))) {
                  selected.push(line.replace(/- \[[xX]\]\s*/i, '').trim());
                }
                if (inSection && line.trim().startsWith('###')) break;
              }
              return selected;
            }

            // Parse highlight and concern from comments
            async function parseComments(issueNumber) {
              let highlight = null, concern = null;
              try {
                const comments = await github.rest.issues.listComments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                });
                // Find comment by the respondent
                for (const comment of comments.data) {
                  if (comment.user.login !== respondent) continue;
                  const body = comment.body || '';
                  const hMatch = body.match(/Highlight:\s*(.+)/i);
                  const cMatch = body.match(/Concern:\s*(.+)/i);
                  if (hMatch) highlight = hMatch[1].trim();
                  if (cMatch) concern = cMatch[1].trim();
                }
              } catch(e) { console.log('No comments found'); }
              return { highlight, concern };
            }

            const { highlight, concern } = await parseComments(issue.number);

            const response = {
              issue_number: issue.number,
              issue_title: issue.title,
              respondent: respondent,
              submitted_at: new Date().toISOString(),
              week: week,
              answers: {
                morale:    parseRating('Team morale', body),
                workload:  parseRating('Workload', body),
                blockers:  parseCheckboxes('Blockers', body),
                highlight: parseCheckboxes('Weekly highlight', body),
                concern:   concern,
              }
            };

            const dir = path.join('responses', week);
            if (!fs.existsSync(dir)) fs.mkdirSync(dir, { recursive: true });

            const filePath = path.join(dir, `${respondent}.json`);
            fs.writeFileSync(filePath, JSON.stringify(response, null, 2));
            console.log(`Saved response for ${respondent} to ${filePath}`);

      - name: Commit response
        run: |
          git config user.name "survey-bot"
          git config user.email "survey-bot@users.noreply.github.com"
          git add responses/
          git diff --staged --quiet || git commit -m "survey: response from ${{ github.event.sender.login }} - ${{ github.event.issue.title }}"
          git push
