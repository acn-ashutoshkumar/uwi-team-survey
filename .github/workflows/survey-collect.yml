name: "Collect Survey Response"

on:
  issues:
    types: [closed]

permissions:
  issues: read
  contents: write

jobs:
  collect-response:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'team-survey')

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse and save response
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const issue = context.payload.issue;
            const body = issue.body || '';

            // Respondent = person who closed the issue
            const respondent = context.payload.sender?.login || issue.user?.login || 'unknown';

            // Extract week from issue title e.g. "2026-W30"
            const titleMatch = issue.title.match(/(\d{4}-W\d{2})/);
            const d = new Date();
            const startOfYear = new Date(d.getFullYear(), 0, 1);
            const weekNum = Math.ceil(((d - startOfYear) / 86400000 + startOfYear.getDay() + 1) / 7);
            const week = titleMatch ? titleMatch[1] : `${d.getFullYear()}-W${String(weekNum).padStart(2,'0')}`;

            // Parse single-select rating — first checked box
            function parseRating(section, body) {
              const lines = body.split('\n');
              let inSection = false;
              for (const line of lines) {
                if (line.includes('### ') && line.includes(section)) { inSection = true; continue; }
                if (inSection && (line.trim().startsWith('- [x]') || line.trim().startsWith('- [X]'))) {
                  const match = line.match(/(\d)/);
                  return match ? parseInt(match[1]) : null;
                }
                if (inSection && line.trim() === '') continue;
                if (inSection && line.trim().startsWith('###')) break;
              }
              return null;
            }

            // Parse checkboxes — multiple
            function parseCheckboxes(section, body) {
              const lines = body.split('\n');
              let inSection = false;
              const selected = [];
              for (const line of lines) {
                if (line.includes('### ') && line.includes(section)) { inSection = true; continue; }
                if (inSection && (line.trim().startsWith('- [x]') || line.trim().startsWith('- [X]'))) {
                  selected.push(line.replace(/- \[[xX]\]\s*/i, '').trim());
                }
                if (inSection && line.trim().startsWith('###')) break;
              }
              return selected;
            }

            // Parse free text written below "Write your answer below this line:"
            function parseText(section, body) {
              const lines = body.split('\n');
              let inSection = false;
              let afterMarker = false;
              const textLines = [];
              for (const line of lines) {
                if (line.includes('### ') && line.includes(section)) { inSection = true; continue; }
                if (inSection && line.includes('Write your answer below this line:')) { afterMarker = true; continue; }
                if (inSection && afterMarker) {
                  if (line.trim().startsWith('###') || line.trim() === '*Once done') break;
                  if (line.trim()) textLines.push(line.trim());
                }
              }
              return textLines.join(' ').trim() || null;
            }

            const response = {
              issue_number: issue.number,
              issue_title: issue.title,
              respondent: respondent,
              submitted_at: new Date().toISOString(),
              week: week,
              answers: {
                morale:    parseRating('Team morale', body),
                blockers:  parseCheckboxes('Blockers', body),
                highlight: parseText('Weekly highlight', body),
                concern:   parseText('Concern or suggestion', body),
              }
            };

            // Save to responses/{week}/{respondent}.json
            const dir = path.join('responses', week);
            if (!fs.existsSync(dir)) fs.mkdirSync(dir, { recursive: true });

            const filePath = path.join(dir, `${respondent}.json`);
            fs.writeFileSync(filePath, JSON.stringify(response, null, 2));
            console.log(`Saved response for ${respondent} to ${filePath}`);

      - name: Commit response
        run: |
          git config user.name "survey-bot"
          git config user.email "survey-bot@users.noreply.github.com"
          git add responses/
          git diff --staged --quiet || git commit -m "survey: response from ${{ github.event.sender.login }} - ${{ github.event.issue.title }}"
          git push
