name: "Collect Survey Response"

on:
  issues:
    types: [closed]

permissions:
  issues: read
  contents: write

jobs:
  collect-response:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'team-survey') && contains(toJson(github.event.issue.assignees.*.login), github.event.sender.login)

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse and save response
        uses: actions/github-script@v7
        with:
          script: |
            const fs   = require('fs');
            const path = require('path');

            const issue      = context.payload.issue;
            const body       = issue.body || '';
            const respondent = context.payload.sender?.login || issue.user?.login || 'unknown';

            // Skip auto-expired issues (closed as not_planned by survey-bot)
            if (issue.state_reason === 'not_planned') {
              console.log(`Skipping auto-expired issue #${issue.number}`);
              return;
            }

            // Extract month from issue title e.g. "2026-07"
            const titleMatch = issue.title.match(/(\d{4}-\d{2})/);
            const d = new Date();
            const month = titleMatch
              ? titleMatch[1]
              : `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;

            // Parse Issue Form dropdown response
            // GitHub Issue Forms render as: "### Q1 — Sprint & Delivery Process\n\n1 - Very Dissatisfied"
            function parseRating(sectionId, body) {
              const lines = body.split('\n');
              let inSection = false;
              for (const line of lines) {
                if (line.startsWith('### ') && line.toLowerCase().includes(sectionId.toLowerCase())) {
                  inSection = true; continue;
                }
                if (inSection && line.trim()) {
                  const match = line.trim().match(/^(\d)/);
                  return match ? parseInt(match[1]) : null;
                }
                if (inSection && line.startsWith('### ')) break;
              }
              return null;
            }

            // Parse Q6 multi-select checkboxes from Issue Form
            function parseMulti(sectionId, body) {
              const lines = body.split('\n');
              let inSection = false;
              const selected = [];
              for (const line of lines) {
                if (line.startsWith('### ') && line.toLowerCase().includes(sectionId.toLowerCase())) {
                  inSection = true; continue;
                }
                if (inSection && (line.trim().startsWith('- [x]') || line.trim().startsWith('- [X]'))) {
                  selected.push(line.replace(/- \[[xX]\]\s*/i, '').trim());
                }
                if (inSection && line.startsWith('### ')) break;
              }
              return selected;
            }

            const response = {
              issue_number: issue.number,
              issue_title:  issue.title,
              respondent:   respondent,
              submitted_at: new Date().toISOString(),
              month:        month,
              answers: {
                // Section 1
                q1_sprint_delivery:     parseRating('Sprint', body),
                q2_collaboration:       parseRating('Collaboration', body),
                q3_tech_debt:           parseRating('Technical Debt', body),
                // Section 2
                q4_roadmap_visibility:  parseRating('Roadmap Visibility', body),
                q5_requirements:        parseRating('Requirements Quality', body),
                // Section 3
                q6_genai_tools:         parseMulti('GenAI Tool Usage', body),
                q7_genai_productivity:  parseRating('GenAI Impact', body),
                q8_genai_confidence:    parseRating('GenAI Confidence', body),
                // Section 4
                q9_client_feedback:     parseRating('Client Feedback', body),
                // Section 5
                q10_overall:            parseRating('Overall Satisfaction', body),
              }
            };

            const dir = path.join('responses', month);
            if (!fs.existsSync(dir)) fs.mkdirSync(dir, { recursive: true });

            const filePath = path.join(dir, `${respondent}.json`);
            fs.writeFileSync(filePath, JSON.stringify(response, null, 2));
            console.log(`Saved response for ${respondent} → ${filePath}`);

      - name: Commit response
        run: |
          git config user.name "survey-bot"
          git config user.email "survey-bot@users.noreply.github.com"
          git add responses/
          git diff --staged --quiet || git commit -m "survey: response from ${{ github.event.sender.login }} - ${{ github.event.issue.title }}"
          git push
