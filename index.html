<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UWI Team Survey Dashboard</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F7F6F2; --surface: #FFFFFF; --border: #E4E2D9;
      --text: #1C1C1A; --text-muted: #888780;
      --accent: #534AB7; --accent-light: #EEEDFE; --accent-hover: #3F379B;
      --teal: #0F6E56; --teal-light: #E1F5EE;
      --amber: #BA7517; --amber-light: #FAEEDA;
      --coral: #993C1D; --coral-light: #FAECE7;
      --radius: 14px; --shadow: 0 2px 12px rgba(0,0,0,0.07);
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 15px; }

    nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 32px; display: flex; align-items: center; height: 52px; justify-content: space-between; }
    .nav-logo { font-weight: 700; font-size: 15px; color: var(--accent); letter-spacing: -0.02em; }
    .logout-btn { padding: 6px 14px; background: none; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; font-size: 13px; color: var(--text-muted); cursor: pointer; display: none; }
    .logout-btn:hover { background: var(--bg); }

    .page { display: none; }
    .page.active { display: block; }

    /* LOGIN */
    .login-wrap { max-width: 400px; margin: 100px auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 40px; box-shadow: var(--shadow); text-align: center; }
    .login-icon { font-size: 40px; margin-bottom: 16px; }
    .login-wrap h2 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .login-wrap p { color: var(--text-muted); font-size: 13px; margin-bottom: 28px; }
    .login-input { width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 14px; margin-bottom: 12px; transition: border-color 0.15s; }
    .login-input:focus { outline: none; border-color: var(--accent); }
    .login-btn { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 8px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
    .login-btn:hover { background: var(--accent-hover); }
    .login-error { color: var(--coral); font-size: 13px; margin-top: 10px; display: none; }
    .login-error.show { display: block; }

    /* DASHBOARD */
    .dash-wrap { padding: 32px; max-width: 1000px; margin: 0 auto; }
    @media (max-width: 640px) { .dash-wrap { padding: 20px 16px; } nav { padding: 0 16px; } }

    .dash-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 12px; }
    .dash-header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
    .dash-header p { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

    .week-nav { display: flex; align-items: center; gap: 8px; }
    .week-nav button { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-family: inherit; transition: background 0.15s; }
    .week-nav button:hover { background: var(--bg); }
    .week-nav button:disabled { opacity: 0.4; cursor: default; }
    #week-label { font-weight: 600; font-size: 14px; min-width: 110px; text-align: center; }

    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; }
    .stat-card .s-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 6px; }
    .stat-card .s-value { font-size: 28px; font-weight: 700; line-height: 1; }
    .stat-card .s-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .stat-card.c-accent { background: var(--accent-light); border-color: var(--accent); }
    .stat-card.c-accent .s-value { color: var(--accent); }
    .stat-card.c-teal { background: var(--teal-light); border-color: var(--teal); }
    .stat-card.c-teal .s-value { color: var(--teal); }
    .stat-card.c-coral { background: var(--coral-light); border-color: var(--coral); }
    .stat-card.c-coral .s-value { color: var(--coral); font-size: 16px; padding-top: 6px; }

    .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
    @media (max-width: 640px) { .charts-grid { grid-template-columns: 1fr; } }
    .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
    .chart-card.wide { grid-column: span 2; }
    @media (max-width: 640px) { .chart-card.wide { grid-column: span 1; } }
    .chart-card h3 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 16px; }
    canvas { max-height: 200px; }

    .blocker-bar-list { list-style: none; }
    .blocker-bar-list li { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .blocker-bar-list li:last-child { border: none; }
    .b-name { min-width: 180px; } .b-wrap { flex: 1; background: var(--bg); border-radius: 4px; height: 8px; } .b-fill { height: 8px; border-radius: 4px; background: var(--coral); transition: width 0.5s; } .b-count { font-weight: 600; color: var(--text-muted); font-size: 12px; min-width: 20px; text-align: right; }

    .resp-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .resp-table th { text-align: left; padding: 8px 12px; border-bottom: 2px solid var(--border); color: var(--text-muted); font-weight: 500; text-transform: uppercase; font-size: 11px; letter-spacing: 0.04em; }
    .resp-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
    .resp-table tr:hover td { background: var(--bg); }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 600; }
    .p1,.p2 { background: var(--teal-light); color: var(--teal); } .p3 { background: var(--amber-light); color: var(--amber); } .p4,.p5 { background: var(--coral-light); color: var(--coral); }
    .empty-state { text-align: center; padding: 60px; color: var(--text-muted); font-size: 14px; }
  </style>
</head>
<body>

<nav>
  <span class="nav-logo">UWI Team Survey</span>
  <button class="logout-btn" id="logout-btn" onclick="logout()">Logout</button>
</nav>

<!-- LOGIN -->
<div class="page active" id="page-login">
  <div class="login-wrap">
    <div class="login-icon">📊</div>
    <h2>Admin Dashboard</h2>
    <p>Enter the admin password to view survey results</p>
    <input class="login-input" type="password" id="admin-password" placeholder="Enter password" onkeydown="if(event.key==='Enter') checkPassword()">
    <button class="login-btn" onclick="checkPassword()">Login</button>
    <div class="login-error" id="login-error">Incorrect password. Please try again.</div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="page" id="page-dashboard">
  <div class="dash-wrap">
    <div class="dash-header">
      <div>
        <h1>Survey Results</h1>
        <p>Accenture &amp; NTT Docomo Global — UWI Platform Team</p>
      </div>
      <div class="week-nav">
        <button id="prev-btn" onclick="changeWeek(-1)">&#8592; Prev</button>
        <span id="week-label">--</span>
        <button id="next-btn" onclick="changeWeek(1)">Next &#8594;</button>
      </div>
    </div>
    <div id="dash-content"><div class="empty-state">Loading...</div></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const GITHUB_OWNER = "acn-ashutoshkumar";
const GITHUB_REPO  = "uwi-team-survey";
const ADMIN_PASSWORD = "uwi-admin-2026";
const TEAM_SIZE = 4;

function getISOWeek(date = new Date()) {
  const d = new Date(date);
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() + 4 - (d.getDay() || 7));
  const y = new Date(d.getFullYear(), 0, 1);
  const w = Math.ceil(((d - y) / 86400000 + 1) / 7);
  return `${d.getFullYear()}-W${String(w).padStart(2,'0')}`;
}

window.addEventListener('load', () => {
  if (sessionStorage.getItem('uwi-admin-auth') === 'true') showDashboard();
});

function checkPassword() {
  const pwd = document.getElementById('admin-password').value;
  if (pwd === ADMIN_PASSWORD) {
    sessionStorage.setItem('uwi-admin-auth', 'true');
    showDashboard();
  } else {
    document.getElementById('login-error').classList.add('show');
    document.getElementById('admin-password').value = '';
  }
}

function showDashboard() {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-dashboard').classList.add('active');
  document.getElementById('logout-btn').style.display = 'block';
  loadDashboard();
}

function logout() {
  sessionStorage.removeItem('uwi-admin-auth');
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-login').classList.add('active');
  document.getElementById('logout-btn').style.display = 'none';
  document.getElementById('admin-password').value = '';
}

let allWeeks = [], currentWeekIndex = 0;

async function loadDashboard() {
  try {
    const res = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/responses`);
    if (!res.ok) throw new Error('no-data');
    const dirs = await res.json();
    allWeeks = dirs.filter(d => d.type === 'dir').map(d => d.name).sort().reverse();
    if (!allWeeks.length) throw new Error('no-data');
    currentWeekIndex = 0;
    renderWeek(allWeeks[0]);
  } catch { renderDemo(); }
}

async function loadWeekResponses(week) {
  const res = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/responses/${week}`);
  if (!res.ok) return [];
  const files = await res.json();
  return Promise.all(files.filter(f => f.name.endsWith('.json')).map(async f => { const r = await fetch(f.download_url); return r.json(); }));
}

function changeWeek(d) {
  currentWeekIndex = Math.max(0, Math.min(allWeeks.length - 1, currentWeekIndex + d));
  renderWeek(allWeeks[currentWeekIndex]);
}

async function renderWeek(week) {
  document.getElementById('week-label').textContent = week;
  document.getElementById('prev-btn').disabled = currentWeekIndex >= allWeeks.length - 1;
  document.getElementById('next-btn').disabled = currentWeekIndex === 0;
  document.getElementById('dash-content').innerHTML = '<div class="empty-state">Loading...</div>';
  const responses = await loadWeekResponses(week);
  renderDashboard(responses, week);
}

function renderDemo() {
  document.getElementById('week-label').textContent = getISOWeek() + ' (demo)';
  document.getElementById('prev-btn').disabled = true;
  document.getElementById('next-btn').disabled = true;
  renderDashboard([
    { respondent: 'acn-ashutoshkumar', submitted_at: new Date().toISOString(), answers: { morale: 4, blockers: ['No blockers'], highlight: 'Completed R2.3 tests', concern: null }},
    { respondent: 'acn-shameethsuresh', submitted_at: new Date().toISOString(), answers: { morale: 3, blockers: ['Waiting on another team'], highlight: null, concern: 'Staging env flaky' }},
    { respondent: 'Prasath-7', submitted_at: new Date().toISOString(), answers: { morale: 5, blockers: ['No blockers'], highlight: 'Great retro!', concern: null }},
    { respondent: 'acn-mohammadzameer', submitted_at: new Date().toISOString(), answers: { morale: 4, blockers: ['Unclear requirements'], highlight: null, concern: null }},
  ], getISOWeek() + ' (demo)');
}

function renderDashboard(responses, week) {
  const total = responses.length;
  const morales = responses.map(r => r.answers?.morale).filter(Boolean);
  const avg = arr => arr.length ? (arr.reduce((a,b) => a+b, 0) / arr.length).toFixed(1) : '--';
  const blockerCounts = {};
  responses.forEach(r => (r.answers?.blockers || []).forEach(b => { blockerCounts[b] = (blockerCounts[b] || 0) + 1; }));
  const sortedBlockers = Object.entries(blockerCounts).sort((a,b) => b[1] - a[1]);
  const maxB = sortedBlockers[0]?.[1] || 1;

  document.getElementById('dash-content').innerHTML = `
    <div class="stats-row">
      <div class="stat-card c-accent"><div class="s-label">Responses</div><div class="s-value">${total}</div><div class="s-sub">${Math.round((total/TEAM_SIZE)*100)}% response rate</div></div>
      <div class="stat-card c-teal"><div class="s-label">Avg morale</div><div class="s-value">${avg(morales)}<span style="font-size:13px;font-weight:400"> /5</span></div><div class="s-sub">${morales.length} rated</div></div>
      <div class="stat-card c-coral"><div class="s-label">Top blocker</div><div class="s-value">${sortedBlockers[0]?.[0]?.split(' ')[0] || '--'}</div><div class="s-sub">${sortedBlockers[0] ? sortedBlockers[0][1] + ' affected' : 'none reported'}</div></div>
    </div>
    <div class="charts-grid">
      <div class="chart-card"><h3>Morale distribution</h3><canvas id="morale-chart"></canvas></div>
      <div class="chart-card"><h3>Blockers reported</h3>
        ${sortedBlockers.length === 0
          ? '<p style="color:var(--text-muted);font-size:13px;padding-top:8px">No blockers this week!</p>'
          : `<ul class="blocker-bar-list">${sortedBlockers.map(([n,c]) => `<li><span class="b-name">${n}</span><span class="b-wrap"><span class="b-fill" style="width:${Math.round((c/maxB)*100)}%"></span></span><span class="b-count">${c}</span></li>`).join('')}</ul>`}
      </div>
      <div class="chart-card wide"><h3>Individual responses &mdash; ${week}</h3>
        ${total === 0
          ? '<p style="color:var(--text-muted);font-size:13px">No responses yet.</p>'
          : `<table class="resp-table"><thead><tr><th>Teammate</th><th>Morale</th><th>Workload</th><th>Blockers</th><th>Highlight</th><th>Concern</th></tr></thead><tbody>
            ${responses.map(r => `<tr>
              <td><strong>${r.respondent}</strong><br><span style="color:var(--text-muted);font-size:11px">${new Date(r.submitted_at).toLocaleDateString()}</span></td>
              <td>${r.answers?.morale ? `<span class="pill p${r.answers.morale}">${r.answers.morale}/5</span>` : '--'}</td>
                  <td>${r.answers?.workload ? `<span class="pill p${r.answers.workload}">${r.answers.workload}/5</span>` : '--'}</td>
              <td style="font-size:12px">${(r.answers?.blockers || []).join(', ') || '--'}</td>
              <td style="font-size:12px;color:var(--text-muted)">${r.answers?.highlight || '--'}</td>
              <td style="font-size:12px;color:var(--text-muted)">${r.answers?.concern || '--'}</td>
            </tr>`).join('')}
            </tbody></table>`}
      </div>
    </div>`;

  const mCounts = [1,2,3,4,5].map(i => morales.filter(m => m === i).length);
  new Chart(document.getElementById('morale-chart'), {
    type: 'bar',
    data: { labels: ['1 Low','2','3 OK','4','5 Great'], datasets: [{ data: mCounts, backgroundColor: ['#F7C1C1','#F09595','#FAC775','#9FE1CB','#5DCAA5'], borderRadius: 6, borderSkipped: false }] },
    options: { plugins: { legend: { display: false } }, scales: { x: { grid: { display: false } }, y: { ticks: { stepSize: 1, precision: 0 }, beginAtZero: true } } }
  });
}
</script>
</body>
</html>
